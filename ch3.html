<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Student Resistration Form </h2>
    <form action="" method="get">
        <!--     <form action="submit.htm" method="get"> -->
    <!-- Personal Information shortcut key ctrl+? -->
     <fieldset>
        <legend> Information </legend>
        <label for="name"> Username: </label>
        <input type="text" name="Username" id="uname" autofocus autocomplete="on" placeholder="Enter Username" required minlength="4" maxlength="10">
        <br><br>
        <label> Email: </label>
        <input type="email" name="email" id="email" placeholder="Enter abc@gmail.com" required>
        <br><br>
        <label> Phone no.: </label>
        <input type="tel" name="Phone" id="phone" placeholder="1234567890" maxlength="10" minlength="10" required>
        <br><br>
        <label> Password: </label>
        <input type="password" name="pwd" id="pwd" placeholder="Enter your password" required minlength="6">
        <br><br>
        <p> Gender : </p>
        <input type="radio" name="Gender" value="male" checked> male
        <input type="radio" name="Gender" value="female"> Female 
        <br><br>
        <label> Date of Birth</label>
        <input type="date" name="dob" id="dob" min="2025-09-07" max="2025-12-17">
        <br><br>
        <p> Hobbies :  </p>
        <input type="checkbox" name="hobby" value="music" checked> Music 
        <input type="checkbox" name="hobby" value="sport" checked> Sport
        <br><br>
        <label> Age : </label>
        <input type="number" name="age" id="age" min="1" max="50" value="18">
        <br><br>
        <label> Favorite Color : </label>
        <input type="color" name="favcolor" id="favcolor" value="Pink">
        <br><br>
        <label> Preffered Browser : </label>
        <input list="Browser" name="browser" id="browser">
        <datalist id="Browser">
            <option value="Chrome">
                <option value="Firefox">
                    <option value="Edge">
        </datalist>
        <br><br>
        <label> Select Branch : </label>
        <select name="degree_branch" id="degree">
            <option value="select" selected disabled> Select Branch </option>
            <optgroup label="Computer">
                <option value="CSE"> CSE </option>
                <option value="CE"> CE </option>
                <option value="IT"> IT </option>
                <option value="AI&ML"> AI&ML </option>
            </optgroup>
            <optgroup label="Other">
                <option value="EC"> EC </option>
            <option value="IC"> IC </option>
            <option value="MECHENICAL"> MECHENICAL </option>
            <option value="CIVIL"> CIVIL </option>
            </optgroup>
        </select>
        <br><br>
        <label> Your Message </label><br>
        <textarea name="Message" id="msg" rows="5" cols="30"> Enter Your Message </textarea>
        <br><br>
        <label> Satisfaction Level : </label>
        <input type="range" name="Satisfaction" id="range" min="0" max="50" step="5" value="25">
        <br><br>
        <input type="hidden" name="userId" value="1234">
        <br>
        <label> Upload Resume</label>
        <input type="file" name="resume" id="resume" accept=".pdf,.doc,.html" multiple>
        <input type="button" value="submit"><br><br><br>
        <input type="reset" value="Resetform">
        <button type="submit"> submit button </button>
     </fieldset>
</body>
</html>
